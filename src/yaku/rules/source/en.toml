lang              = "en"
letter            = '[A-Za-z]'
word              = '[A-Za-z]{2,}'
min_alpha_ratio   = 0.45
min_words         = 3
sentence_end      = '[.:;!?]\s*$'
sentence_split    = '(?<![A-Z]\.)(?<!\be\.g\.)(?<!\bi\.e\.)(?<!\bvs\.)(?<!\betc\.)(?<=[.!?])\s{1,3}(?=[A-Z(])'
max_segment_chars = 220

# Segments with a colon in the middle lost the clause before it 87% of the
# time in labelled manual pages and PEP 8: "... works as follows: The server
# sends ..." came back without the lead-in. Translated on its own, the
# lead-in survives. Labels such as "Plan:" are too short to be split off.
clause_split      = ':\s+(?=\S)'
clause_min_words  = 4
