lang              = "en"
letter            = '[A-Za-z]'
word              = '[A-Za-z]{2,}'
min_alpha_ratio   = 0.45
min_words         = 3
sentence_end      = '[.:;!?]\s*$'
sentence_split    = '(?<![A-Z]\.)(?<!\be\.g\.)(?<!\bi\.e\.)(?<!\bvs\.)(?<!\betc\.)(?<=[.!?])\s{1,3}(?=[A-Z(])'
max_segment_chars = 220

# The decoder tends to translate only one of two clauses joined by a colon
# or a semicolon. In labelled manual pages and PEP 8, 87% of segments with a
# colon in the middle and 37% of those with a semicolon lost a clause; each
# clause translated on its own survives. Labels such as "Plan:" and code
# such as "do_one(); do_two()" have too few words to be split.
clause_split      = '[:;]\s+(?=\S)'
clause_min_words  = 4

# "a; b; and c" is one list: splitting it loses the items' shared subject.
# "; or" is not included: what follows it is an alternative clause of its
# own, and in held-out manual pages keeping such segments whole dropped that
# clause in 3 of 4 cases.
clause_list       = ';\s+and\b'
