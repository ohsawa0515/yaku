name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yaku/
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4.4.0
      - uses: astral-sh/setup-uv@v6.8.0
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re;print(re.search(r'\"(.+)\"', open('src/yaku/__init__.py').read()).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      # Trusted publishing: no API token is stored in the repository.
      - run: uv publish --trusted-publishing always
