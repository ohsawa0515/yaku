name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: "3.12"
      - name: Check the tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import re;print(re.search(r'\"(.+)\"', open('src/yaku/__init__.py').read()).group(1))")
          test "v${version}" = "${GITHUB_REF_NAME}"
      - run: uv sync --locked
      - run: uv run pytest -q
      - run: uv build
      - uses: actions/upload-artifact@v4.6.2
        with:
          name: dist
          path: dist/

  # Only this job can mint a PyPI token, and it runs no project code.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/yaku/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4.3.0
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv publish --trusted-publishing always
