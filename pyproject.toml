[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yaku"
description = "Offline translator for command output that keeps identifiers intact"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Shuichi Ohsawa" }]
keywords = ["translation", "cli", "offline", "nmt"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Japanese",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Utilities",
]
# Rule files are TOML: tomllib is in the standard library, and its literal
# strings hold regular expressions without escaping.
dependencies = [
    "ctranslate2>=4.0",
    "sentencepiece>=0.2",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/ohsawa0515/yaku"
Repository = "https://github.com/ohsawa0515/yaku"
Issues = "https://github.com/ohsawa0515/yaku/issues"

[project.scripts]
yaku = "yaku.cli:run"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.version]
path = "src/yaku/__init__.py"

# An allowlist, so local scratch files ignored outside .gitignore stay out.
[tool.hatch.build.targets.sdist]
only-include = ["src", "tests", "LICENSE", "README.md", "README.ja.md", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/yaku"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "RUF001",  # ambiguous characters are intended: box drawing, fullwidth punctuation
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Test inputs are real command output, which is as long as it is.
"tests/*" = ["E501"]
